[package]
name = "argus-sync-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The sync engine of argus-bridge: a local folder kept in two-way sync with a folder on an Argus server"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
walkdir = "2"
unicode-normalization = "0.1"
filetime = "0.2"
trash = "5"
urlencoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "5"
rand = "0.8"
tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
portable-pty = "0.9"
base64 = "0.22"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
csv = "1"
totp-rs = { version = "5", features = ["otpauth"] }
# Logins kept in argus-bridge's own sealed file: the Keychain asks again after every update of an app
# without an Apple Developer ID.
chacha20poly1305 = "0.10"

[dev-dependencies]
tempfile = "3"
