<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>argus-bridge — an agent is at work</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #12161d; color: #e8ebf1; overflow: hidden;
    font: 13px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  .pill { height: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 14px;
    border: 1px solid #7fd1a5; border-radius: 10px; -webkit-app-region: drag; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #7fd1a5; box-shadow: 0 0 0 0 #7fd1a588; animation: beat 1.6s infinite; flex: none; }
  @keyframes beat { 0% { box-shadow: 0 0 0 0 #7fd1a588; } 70% { box-shadow: 0 0 0 7px #7fd1a500; } 100% { box-shadow: 0 0 0 0 #7fd1a500; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  .what { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button { -webkit-app-region: no-drag; font: inherit; font-weight: 600; color: #12161d; background: #f0a3a3; border: 0;
    border-radius: 7px; padding: 6px 12px; cursor: pointer; }
  button:hover { background: #ffb8b8; }
  button:focus-visible { outline: 2px solid #e8ebf1; outline-offset: 2px; }
</style>
</head>
<body>
<div class="pill" role="status">
  <span class="dot" aria-hidden="true"></span>
  <span class="what" id="what"></span>
  <button type="button" id="stop"></button>
</div>
<script type="module">
  import { t } from './words.js';
  document.getElementById('what').textContent = t('An agent is using your browser');
  const stop = document.getElementById('stop');
  stop.textContent = t('Stop');
  stop.title = t('Close every agent’s connection to the browser now, and lend it no more until you switch Browser on again');
  stop.onclick = async () => {
    stop.disabled = true;
    try { await window.__TAURI__.core.invoke('stop_agents'); } catch { stop.disabled = false; }
  };
</script>
</body>
</html>
