# Every change: the engine's tests on macOS, Windows and Linux (the cross-OS rules are only proven
# where they apply), the window's tests, and the app's own tests. A tag v* also builds the app for all
# three and publishes the installers: building them at every push filled GitHub's five macOS machines
# with pushes, and a release waited behind them (2026-11-10).
name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

# Creating the release with the installers needs to write to the repository.
permissions:
  contents: write

# A newer push makes an older run of the same branch pointless; a release is never cancelled.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The ~500 crates compiled once, then kept: most of a build's time was compiling them again.
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests (names, plan, links)
        run: cargo test -p argus-sync-core --lib
      # One Python, the one `python3` names: on newer runners `pip` and `python3` were two different ones.
      - uses: actions/setup-python@v5
        if: runner.os != 'Windows'
        with:
          python-version: "3.12"
      - name: Against a real Argus
        if: runner.os != 'Windows'      # Argus itself runs on Linux and macOS
        shell: bash
        run: |
          git clone --depth 1 https://github.com/andreaderuvo/argus.git ../argus-src
          # What Argus itself needs, from its own list: a package it starts needing must not break this.
          python3 -m pip install -r ../argus-src/requirements.txt
          ARGUS_SRC=$PWD/../argus-src cargo test -p argus-sync-core --test against_argus
      - name: The command-line client
        run: cargo build --release -p argus-sync-cli
      - uses: actions/upload-artifact@v4
        with:
          name: argus-bridge-cli-${{ matrix.os }}
          path: |
            target/release/argus-bridge
            target/release/argus-bridge.exe

  # The app's own tests, at every push (Linux: the window's toolkit is there to install).
  app-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: Linux toolkits
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      # The window's state drawn without waiting on itself: 0.1.10 hung at start.
      - name: The app's tests
        run: cargo test --manifest-path app/src-tauri/Cargo.toml --lib

  app:
    needs: [engine, app-check]
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: windows-latest
            args: ""
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          key: ${{ matrix.args }}
      - name: Linux toolkits
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      # One code-signing certificate, always the same (ours, self-signed: ~/.keys/argus-bridge-codesign.*).
      # Ad-hoc signing gave every build a new identity, so macOS forgot every "Allow" at each update and
      # asked again — with an agent waiting on the Mac until somebody pressed it (2026-11-09). Signed with
      # one certificate, an "Always allow" given once holds across updates. Skipped without the secret.
      - name: Code-signing certificate (macOS)
        if: runner.os == 'macOS' && env.MACOS_CODESIGN_P12 != ''
        env:
          MACOS_CODESIGN_P12: ${{ secrets.MACOS_CODESIGN_P12 }}
          MACOS_CODESIGN_PASSWORD: ${{ secrets.MACOS_CODESIGN_PASSWORD }}
        run: |
          echo "$MACOS_CODESIGN_P12" | base64 --decode > "$RUNNER_TEMP/cs.p12"
          K="$RUNNER_TEMP/sign.keychain-db"
          security create-keychain -p ci "$K"
          security set-keychain-settings -lut 7200 "$K"
          security unlock-keychain -p ci "$K"
          security import "$RUNNER_TEMP/cs.p12" -k "$K" -P "$MACOS_CODESIGN_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$K" >/dev/null
          security list-keychains -d user -s "$K" $(security list-keychains -d user | tr -d '"')
          # Self-signed: trusted for code signing on this runner, or codesign will not use it.
          openssl pkcs12 -in "$RUNNER_TEMP/cs.p12" -nokeys -passin "pass:$MACOS_CODESIGN_PASSWORD" -legacy -out "$RUNNER_TEMP/cs.pem" 2>/dev/null \
            || openssl pkcs12 -in "$RUNNER_TEMP/cs.p12" -nokeys -passin "pass:$MACOS_CODESIGN_PASSWORD" -out "$RUNNER_TEMP/cs.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cs.pem"
          security find-identity -p codesigning "$K"
          echo "APPLE_SIGNING_IDENTITY=argus-bridge" >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Every installer signed, and latest.json beside them: the app updates itself from it,
          # and refuses anything this key did not sign (the public half is in tauri.conf.json).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: argus-bridge ${{ github.ref_name }}
          releaseDraft: false
      - name: The app is signed with our certificate (macOS)
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        run: |
          app=$(ls -d app/src-tauri/target/*/release/bundle/macos/*.app | head -1)
          codesign -dvv "$app" 2>&1 | tee "$RUNNER_TEMP/sig.txt"
          grep -q "Authority=argus-bridge" "$RUNNER_TEMP/sig.txt"
          grep -q "Identifier=io.github.andreaderuvo.argus-sync" "$RUNNER_TEMP/sig.txt"
          codesign --verify --deep --strict "$app"
      # Every build's installers, downloadable from the run's page (a tag also attaches them to a release).
      - uses: actions/upload-artifact@v4
        with:
          name: argus-bridge-app-${{ runner.os }}
          path: |
            app/src-tauri/target/**/release/bundle/dmg/*.dmg
            app/src-tauri/target/**/release/bundle/nsis/*.exe
            app/src-tauri/target/**/release/bundle/msi/*.msi
            app/src-tauri/target/**/release/bundle/appimage/*.AppImage
            app/src-tauri/target/**/release/bundle/deb/*.deb
            app/src-tauri/target/**/release/bundle/rpm/*.rpm
          if-no-files-found: error

  window:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: pip install pytest websockets
      - run: ARGUS_CHROMIUM=${{ steps.chrome.outputs.chrome-path }} python -m pytest -q tests/ui
